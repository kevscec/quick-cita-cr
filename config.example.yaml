appointment:
  license_class: B1
  branches:
    - ALAJUELA
    - HEREDIA
  quick_window_days: 21
  notify_on_first_run: true
  notify_on_new_dates: true
  notify_on_earlier_best: true
  notify_on_within_window: true
schedule:
  interval_minutes: 12
  jitter_percent: 20
  max_failures_before_pause: 3
  pause_minutes_after_failures: 60
browser:
  headless: true
  # Prefer a real installed browser for production. Examples:
  # channel: chrome
  # executable_path: /usr/bin/google-chrome-stable
  channel: null
  executable_path: null
  profile_dir: ~/.local/share/quick-cita-cr/browser-profile
  timeout_seconds: 45
notifications:
  email:
    enabled: true
    smtp_host: smtp.gmail.com
    smtp_port: 587
    from_address: your.gmail@gmail.com
    to_addresses:
      - your.gmail@gmail.com
